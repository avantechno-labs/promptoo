<script>
const q=new URLSearchParams(location.search);const g=q.get("g");const base=q.get("base")?JSON.parse(q.get("base")):{};const tt=q.get("t")!=null?+q.get("t"):.5;
const SELS=q.get("sels")?JSON.parse(q.get("sels")):null;const names=SELS?SELS.map(x=>x.label):(q.get("names")?q.get("names").split("|"):Stage3D.names(g));const W=+q.get("w")||256,H=Math.round(W*9/16);
const errs=[];console.error=(...a)=>errs.push(a.join(" ").slice(0,150));
const st=new Stage3D.Stage({canvas:document.createElement("canvas"),width:W,height:H,pixelRatio:1});
const box=document.getElementById("g");
names.forEach(n=>{
  let sel=JSON.parse(JSON.stringify(base));if(SELS){sel=SELS.find(x=>x.label===n).sel}else sel[g]=[n];
  try{st.apply({sel,scene:{subject:"a woman in a red coat",action:q.get("action")||"stands"},char:q.get("char")?JSON.parse(q.get("char")):null,dur:5});st.renderAt(tt,.016);st.renderAt(tt,.016);}catch(e){errs.push(n+" "+e.message)}
  const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(st.canvas,0,0,W,H);
  const d=document.createElement("div");d.style.width=W+"px";d.appendChild(c);const l=document.createElement("div");l.textContent=n;d.appendChild(l);box.appendChild(d);
});
document.getElementById("o").textContent="done "+names.length+" errs "+JSON.stringify(errs);
</script>
